<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PilzLog">
<meta name="theme-color" content="#4F6B2E">
<title>PilzLog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #F3EFE6; --surface: #FFFDF8; --surface-2: #EEE8DC;
    --ink: #2A2118; --ink-soft: #6B5D4C; --ink-faint: #9A8C79; --border: #DDD3C2;
    --accent: #4F6B2E; --accent-strong: #36491F; --accent-wash: #E6ECD8;
    --cap: #9A5B2B; --cap-wash: #F3E3D3;
    --danger: #B23A2E; --danger-wash: #F6DEDA;
    --warn: #A87A0B; --warn-wash: #F6ECD0;
    --rain: #2F6FA6; --temp: #C0562B;
    --glass: rgba(255, 253, 248, 0.82);
    --shadow: 0 8px 24px -12px rgba(42, 33, 24, 0.35);
    --radius: 10px;
    --nav-h: 62px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161410; --surface: #1F1C17; --surface-2: #1A1814;
      --ink: #EDE6DA; --ink-soft: #B3A893; --ink-faint: #7D7464; --border: #353026;
      --accent: #8DB05C; --accent-strong: #C3DA9C; --accent-wash: #26301A;
      --cap: #D79A63; --cap-wash: #33251A;
      --danger: #E57368; --danger-wash: #3A1D1A;
      --warn: #E2B84B; --warn-wash: #352A12;
      --rain: #6FA8DC; --temp: #E8935F;
      --glass: rgba(31, 28, 23, 0.82);
      --shadow: 0 8px 28px -12px rgba(0, 0, 0, 0.6);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--ink); }
  h1, h2, h3 { margin: 0; line-height: 1.2; }

  /* Kopfzeile */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 900;
    padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
    display: flex; align-items: center; gap: 10px;
    background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 19px; letter-spacing: 0.2px; flex: 1; display: flex; align-items: center; gap: 8px; }
  .topbar h1 svg { width: 26px; height: 26px; }
  .iconbtn {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); display: grid; place-items: center; padding: 0;
  }
  .iconbtn svg { width: 20px; height: 20px; }

  /* Ansichten */
  .view { position: fixed; inset: 0; display: none; }
  .view.active { display: block; }
  .scroll {
    position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(env(safe-area-inset-top) + 72px) 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);
  }
  .scroll > .inner { max-width: 760px; margin: 0 auto; }
  #map { position: absolute; inset: 0; background: var(--surface-2); }

  /* Navigation unten */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 900;
    height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
  }
  .nav button {
    border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-size: 12px; color: var(--ink-soft);
  }
  .nav button svg { width: 24px; height: 24px; }
  .nav button.active { color: var(--accent); font-weight: 600; }

  /* Kartenknöpfe */
  .fabs {
    position: fixed; right: 14px; z-index: 800;
    bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
  }
  .fab {
    display: flex; align-items: center; gap: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink); border-radius: 999px; padding: 10px 16px;
    box-shadow: var(--shadow); font-weight: 600; font-size: 15px;
  }
  .fab svg { width: 20px; height: 20px; }
  .fab.primary { background: var(--accent); color: #fff; border-color: transparent; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fab.primary { color: #10140A; } }
  .fab.round { width: 46px; height: 46px; padding: 0; justify-content: center; }
  .layerbtn { position: fixed; right: 14px; top: calc(env(safe-area-inset-top) + 70px); z-index: 800; }

  /* Hinweisleiste beim Zeichnen */
  .drawbar {
    position: fixed; left: 12px; right: 12px; z-index: 850; top: calc(env(safe-area-inset-top) + 66px);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 10px 12px; display: none;
    max-width: 560px; margin: 0 auto;
  }
  .drawbar.show { display: block; }
  .drawbar p { margin: 0 0 8px; font-size: 14px; color: var(--ink-soft); }
  .drawbar .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .crosshair {
    position: fixed; left: 50%; top: 50%; z-index: 700; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    pointer-events: none; display: none; color: var(--danger);
  }
  .crosshair.show { display: block; }

  .btn {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px;
    padding: 9px 14px; font-weight: 600; font-size: 15px;
  }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: 0.45; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #10140A; } }

  /* Bottom Sheet */
  .sheet-bg { position: fixed; inset: 0; z-index: 1000; background: rgba(20, 16, 10, 0.45); display: none; }
  .sheet-bg.show { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1001; max-height: 92vh; overflow-y: auto;
    background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
    padding: 8px 16px calc(env(safe-area-inset-bottom) + 20px);
    transform: translateY(105%); transition: transform 0.22s ease;
    max-width: 760px; margin: 0 auto;
  }
  .sheet.show { transform: translateY(0); }
  .sheet .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 4px auto 12px; }
  .sheet h2 { font-size: 20px; margin-bottom: 4px; }
  .sheet .sub { color: var(--ink-soft); font-size: 14px; margin-bottom: 14px; }
  .sheet .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

  /* Formulare */
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  .field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number], .field select, .field textarea {
    width: 100%; border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 10px 12px;
  }
  .field textarea { min-height: 70px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 14px;
  }
  .chip.on { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-strong); font-weight: 600; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.on { color: var(--accent); } }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .photos .ph { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
  .photos .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photos .ph button {
    position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,0.55); color: #fff; font-size: 15px; line-height: 26px; padding: 0;
  }
  .addphoto {
    aspect-ratio: 1; border: 1.5px dashed var(--border); border-radius: 8px; display: grid; place-items: center;
    color: var(--ink-soft); font-size: 13px; text-align: center; background: none;
  }
  .hint { font-size: 13px; color: var(--ink-faint); margin-top: 4px; }

  /* Karten / Listen */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px;
  }
  .card h3 { font-size: 17px; }
  .muted { color: var(--ink-soft); }
  .faint { color: var(--ink-faint); font-size: 13px; }
  .sectiontitle { font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--ink-faint); margin: 20px 0 8px; font-weight: 700; }
  .pagetitle { font-size: 24px; margin-bottom: 4px; }
  .lead { color: var(--ink-soft); margin: 0 0 14px; }
  .empty { text-align: center; color: var(--ink-soft); padding: 36px 12px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar select { flex: 1; min-width: 140px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 9px 10px; }

  .fund { display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .fund .thumb { width: 64px; height: 64px; border-radius: 8px; flex: none; background: var(--cap-wash); display: grid; place-items: center; overflow: hidden; }
  .fund .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .fund .thumb svg { width: 34px; height: 34px; }
  .fund .txt { flex: 1; min-width: 0; }
  .fund .txt b { display: block; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-soft); margin: 4px 4px 0 0; }
  .tag.ok { background: var(--accent-wash); color: var(--accent-strong); }
  .tag.warn { background: var(--warn-wash); color: var(--warn); }
  .tag.danger { background: var(--danger-wash); color: var(--danger); }
  .tag.cap { background: var(--cap-wash); color: var(--cap); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.ok { color: var(--accent); } }

  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
  .metric { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
  .metric .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .metric .l { font-size: 12px; color: var(--ink-soft); }
  .chart { width: 100%; height: auto; display: block; margin-top: 6px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  /* Prognose */
  .prog { display: grid; grid-template-columns: 1fr 64px 64px; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); }
  .prog:first-of-type { border-top: 0; }
  .prog .name { font-weight: 600; }
  .prog .why { font-size: 12px; color: var(--ink-soft); }
  .bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 4px; }
  .pct { font-size: 12px; text-align: center; color: var(--ink-soft); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .proghead { display: grid; grid-template-columns: 1fr 64px 64px; gap: 8px; font-size: 12px; color: var(--ink-faint); text-align: center; margin-top: 10px; }
  .proghead span:first-child { text-align: left; }

  /* Pilzkarten */
  .pk { padding: 0; overflow: hidden; }
  .pk > summary { list-style: none; display: flex; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; }
  .pk > summary::-webkit-details-marker { display: none; }
  .pk .ico { width: 48px; height: 48px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--cap-wash); }
  .pk .ico svg { width: 32px; height: 32px; }
  .pk .head { flex: 1; min-width: 0; }
  .pk .head b { display: block; }
  .pk .head i { color: var(--ink-soft); font-size: 14px; }
  .pk .body { padding: 0 14px 14px; border-top: 1px solid var(--border); }
  .season { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; margin: 12px 0 4px; }
  .season span { height: 22px; border-radius: 3px; background: var(--surface-2); font-size: 10px; display: grid; place-items: center; color: var(--ink-faint); }
  .season span.s { background: var(--accent-wash); color: var(--accent-strong); }
  .season span.h { background: var(--accent); color: #fff; font-weight: 700; }
  .season span.now { outline: 2px solid var(--cap); outline-offset: -2px; }
  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; font-size: 14px; margin: 10px 0; }
  .kv dt { color: var(--ink-soft); font-weight: 600; }
  .kv dd { margin: 0; }
  .pk h4 { margin: 14px 0 6px; font-size: 14px; }
  .pk ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .vw { border-left: 3px solid var(--border); padding: 4px 0 4px 10px; margin: 6px 0; font-size: 14px; }
  .vw.toedlich { border-color: var(--danger); }
  .vw.giftig { border-color: var(--warn); }
  .rules { background: var(--warn-wash); border-color: transparent; }
  .rules li { margin-bottom: 6px; font-size: 14px; }
  .warncard { border-left: 4px solid var(--danger); }
  .warncard.giftig { border-left-color: var(--warn); }
  .warncard.unge { border-left-color: var(--ink-faint); }

  /* Leaflet-Anpassungen */
  .leaflet-control-attribution { font-size: 10px; background: var(--glass) !important; color: var(--ink-soft); }
  .leaflet-control-attribution a { color: var(--ink-soft); }
  .leaflet-control-zoom { display: none; }
  .leaflet-control-scale { margin-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px) !important; }
  .fundpin { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
  .fundpin svg { width: 22px; height: 22px; }
  .revlabel { background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; font-weight: 600; font-size: 12px; box-shadow: none; padding: 2px 6px; }
  .revlabel::before { display: none; }
  .vertex { width: 14px; height: 14px; border-radius: 50%; background: var(--danger); border: 2px solid #fff; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 1100;
    bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 80px);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }
  .gallery { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 10px; padding: 0 16px; scroll-snap-type: x mandatory; }
  .gallery img { height: 220px; border-radius: 10px; scroll-snap-align: start; flex: none; max-width: 85vw; object-fit: cover; }
  .viewer { position: fixed; inset: 0; z-index: 1200; background: rgba(0,0,0,0.92); display: none; place-items: center; }
  .viewer.show { display: grid; }
  .viewer img { max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>

<header class="topbar">
  <h1><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 15c0-6.6 5.4-11 12-11s12 4.4 12 11c0 .8-.6 1.4-1.4 1.4H5.4C4.6 16.4 4 15.8 4 15z" fill="var(--cap)"/><path d="M12.5 16.4h7l1 9.6a2.6 2.6 0 0 1-2.6 2.9h-3.8a2.6 2.6 0 0 1-2.6-2.9z" fill="var(--cap-wash)" stroke="var(--cap)" stroke-width="1.4"/><circle cx="11" cy="10" r="1.6" fill="var(--cap-wash)"/><circle cx="19.5" cy="8.6" r="1.3" fill="var(--cap-wash)"/><circle cx="22.5" cy="12.4" r="1.1" fill="var(--cap-wash)"/></svg><span id="title">PilzLog</span></h1>
  <button class="iconbtn" id="btnMenu" aria-label="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>

<!-- Karte -->
<section class="view active" id="view-karte">
  <div id="map"></div>
  <button class="iconbtn layerbtn" id="btnLayer" aria-label="Kartenstil wechseln"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/></svg></button>
  <div class="fabs" id="mapFabs">
    <button class="fab round" id="btnLocate" aria-label="Mein Standort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    <button class="fab" id="btnRevier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7 10 4l9 3 1 9-7 4-9-3z"/></svg>Revier</button>
    <button class="fab" id="btnFoto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Aus Foto</button>
    <button class="fab primary" id="btnFund"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Fund</button>
  </div>
  <div class="drawbar" id="drawbar">
    <p id="drawText"></p>
    <div class="row" id="drawRow"></div>
  </div>
  <svg class="crosshair" id="crosshair" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="22" cy="22" r="9"/><path d="M22 2v10M22 32v10M2 22h10M32 22h10"/></svg>
</section>

<!-- Funde -->
<section class="view" id="view-funde"><div class="scroll"><div class="inner" id="fundeInner"></div></div></section>
<!-- Prognose -->
<section class="view" id="view-prognose"><div class="scroll"><div class="inner" id="progInner"></div></div></section>
<!-- Pilzkarten -->
<section class="view" id="view-karten"><div class="scroll"><div class="inner" id="kartenInner"></div></div></section>

<nav class="nav" id="nav">
  <button data-view="karte" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Karte</button>
  <button data-view="funde"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11c0-4 3.6-7 8-7s8 3 8 7H4z"/><path d="M10 11h4l.6 7a2 2 0 0 1-2 2h-1.2a2 2 0 0 1-2-2z"/></svg>Funde</button>
  <button data-view="prognose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 18a4 4 0 0 1-.6-8 6 6 0 0 1 11.4 1.5A3.5 3.5 0 0 1 17 18z"/><path d="M9 21l1-2M13 21l1-2"/></svg>Prognose</button>
  <button data-view="karten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="3" width="13" height="17" rx="2"/><path d="M8 7h5M8 11h5M8 15h3"/><path d="M19 7v13a1 1 0 0 1-1 1H8"/></svg>Pilzkarten</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<div class="viewer" id="viewer"><img id="viewerImg" alt="Foto groß"></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
<input type="file" id="fotoFundInput" accept="image/*" multiple hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="pilzkarten.js"></script>
<script>
'use strict';
/* =========================================================================
   PilzLog – Pilzfunde loggen, Wetter festhalten, Chancen ableiten.
   Alle Daten bleiben auf dem Gerät (IndexedDB). Nach außen gehen nur:
   Kartenkacheln (OpenStreetMap/OpenTopoMap) und gerundete Koordinaten an Open-Meteo (Wetter).
   ========================================================================= */

const LEBENSRAEUME = ['Nadelwald', 'Mischwald', 'Laubwald', 'Waldrand', 'Park/Wiese', 'Auwald'];

/* ---------- Speicher (IndexedDB) ---------- */
const DB = (() => {
  let dbp;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('pilzlog', 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        db.createObjectStore('reviere', { keyPath: 'id' });
        db.createObjectStore('funde', { keyPath: 'id' });
        const f = db.createObjectStore('fotos', { keyPath: 'id' });
        f.createIndex('fundId', 'fundId');
        db.createObjectStore('meta', { keyPath: 'key' });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(store, mode, fn) {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode); const s = t.objectStore(store);
      const out = fn(s);
      t.oncomplete = () => res(out && 'result' in out ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  }
  return {
    all: store => tx(store, 'readonly', s => s.getAll()),
    get: (store, id) => tx(store, 'readonly', s => s.get(id)),
    put: (store, obj) => tx(store, 'readwrite', s => s.put(obj)),
    del: (store, id) => tx(store, 'readwrite', s => s.delete(id)),
    byIndex: (store, idx, val) => tx(store, 'readonly', s => s.index(idx).getAll(val))
  };
})();

function loadImage(file) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
}
function scaleTo(img, max, q) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

/* ---------- Wetter (Open-Meteo, ohne Schlüssel) ---------- */
const DAILY = 'precipitation_sum,temperature_2m_mean,temperature_2m_max,temperature_2m_min,relative_humidity_2m_mean,soil_temperature_0_to_7cm_mean,soil_moisture_0_to_7cm_mean';
async function fetchRange(api, lat, lon, start, end) {
  const base = api === 'archive' ? 'https://archive-api.open-meteo.com/v1/archive' : 'https://api.open-meteo.com/v1/forecast';
  const url = `${base}?latitude=${lat.toFixed(2)}&longitude=${lon.toFixed(2)}&start_date=${start}&end_date=${end}&daily=${DAILY}&timezone=Europe%2FBerlin`;
  const r = await fetch(url); const j = await r.json();
  if (j.error) throw new Error(j.reason || 'Wetterdienst-Fehler');
  const d = j.daily;
  return d.time.map((t, i) => ({
    t, p: d.precipitation_sum[i], tm: d.temperature_2m_mean[i], tx: d.temperature_2m_max[i], tn: d.temperature_2m_min[i],
    rh: d.relative_humidity_2m_mean[i], st: d.soil_temperature_0_to_7cm_mean[i], sm: d.soil_moisture_0_to_7cm_mean[i]
  }));
}
/* Holt Tageswerte von start bis end. Jüngere Tage (≈ letzte 3 Monate + Vorhersage) kommen aus der Vorhersage-API,
   ältere aus dem Archiv (ERA5). Tage ab heute sind als Vorhersage markiert. */
async function fetchWeather(lat, lon, start, end) {
  const cut = addDays(today(), -85);
  const parts = [];
  if (start < cut) parts.push(fetchRange('archive', lat, lon, start, end < cut ? end : addDays(cut, -1)));
  if (end >= cut) parts.push(fetchRange('forecast', lat, lon, start > cut ? start : cut, end));
  const days = (await Promise.all(parts)).flat();
  const t0 = today();
  return days.map(d => ({ ...d, fc: d.t >= t0 }));
}
/* Kennzahlen bezogen auf einen Stichtag (Fund- oder Prognosetag) */
function summarize(days, ref) {

  const sum = (arr, k) => arr.reduce((s, d) => s + (d[k] ?? 0), 0);
  const avg = (arr, k) => { const v = arr.map(d => d[k]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const before14 = sel(-14, -1), before7 = sel(-7, -1), after = sel(1, 7);
  let sinceRain = null;
  for (let i = -1; i >= -WETTER_VOR; i--) { const d = days.find(x => rel(x) === i); if (d && d.p >= 10) { sinceRain = -i; break; } }
  return {
    rain7: sum(before7, 'p'), rain14: sum(before14, 'p'), rain21: sum(sel(-21, -1), 'p'),
    tmean7: avg(before7, 'tm'), tmean14: avg(before14, 'tm'), soil7: avg(before7, 'st'), moist7: avg(before7, 'sm'), rh7: avg(before7, 'rh'),
    frost14: before14.some(d => d.tn != null && d.tn <= 0), sinceRain,
    rainAfter: after.length ? sum(after, 'p') : null, tAfter: avg(after, 'tm'), afterDays: after.filter(d => !d.fc).length

}
function fundPosition(f) {
  if (f.lat != null) return [f.lat, f.lng];
  const r = state.reviere.find(x => x.id === f.revierId); return r ? centroid(r.punkte) : null;
}
async function updateFundWeather(f, force = false) {
  const t0 = today();
  const complete = f.wetter && f.wetter.komplett;
  if (complete && !force) return false;
  const pos = fundPosition(f); if (!pos) return false;
  const end = addDays(f.datum, WETTER_NACH) < t0 ? addDays(f.datum, WETTER_NACH) : addDays(t0, -1);
  const start = addDays(f.datum, -WETTER_VOR);
  if (end < start) return false;
  const days = (await fetchWeather(pos[0], pos[1], start, end)).filter(d => !d.fc);
  f.wetter = { days, sum: summarize(days, f.datum), komplett: addDays(f.datum, WETTER_NACH) < t0, abgerufen: t0 };
  await DB.put('funde', f);
  return true;
}
async function refreshPendingWeather() {
  if (!navigator.onLine) return;
  let n = 0;
  for (const f of state.funde) {
    if (f.wetter?.komplett) continue;
    if (f.wetter?.abgerufen === today()) continue;
    try { if (await updateFundWeather(f)) n++; } catch (e) { console.warn('Wetter', e); }
  }
  if (n) { renderCurrentView(); }
}

/* ---------- Geometrie ---------- */
function centroid(pts) {
  const n = pts.length; return [pts.reduce((s, p) => s + p[0], 0) / n, pts.reduce((s, p) => s + p[1], 0) / n];
}

  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [yi, xi] = pts[i], [yj, xj] = pts[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function revierAt(latlng) { return state.reviere.find(r => inPolygon(latlng, r.punkte)); }
function areaHa(pts) {
  const R = 6371000, lat0 = centroid(pts)[0] * Math.PI / 180;
  const xy = pts.map(([la, lo]) => [lo * Math.PI / 180 * R * Math.cos(lat0), la * Math.PI / 180 * R]);
  let a = 0; for (let i = 0, j = xy.length - 1; i < xy.length; j = i++) a += (xy[j][0] + xy[i][0]) * (xy[j][1] - xy[i][1]);
  return Math.abs(a / 2) / 10000;
}

  }, () => toast('Standort nicht verfügbar – Freigabe in den Einstellungen prüfen'), { enableHighAccuracy: true, timeout: 12000 });
}

/* Funde aus Fotos: Ort, Datum und Uhrzeit aus den Fotodaten. Mehrere Fotos werden nach Ort (≤ 40 m)
   und Zeit (≤ 20 Min.) zu Funden gruppiert und nacheinander zum Bestätigen angezeigt. */
let fundQueue = [], queueTotal = 0, queueNr = 0;
async function startFromPhotos(files) {
  if (!files.length) return;
  toast(`${files.length} Foto(s) werden gelesen …`, 4000);
  const items = [];
  for (const file of files) {
    try {
      const [exif, ph] = await Promise.all([Exif.read(file), processPhoto(file)]);
      const ts = exif.date ? parseIso(exif.date).getTime() - 12 * 3600000 + (+exif.time.slice(0, 2) * 60 + +exif.time.slice(3)) * 60000 : file.lastModified;
      items.push({ exif, ...ph, ts, mod: file.lastModified });
    } catch { toast('Ein Foto konnte nicht gelesen werden'); }
  }
  items.sort((a, b) => a.ts - b.ts);
  const groups = [];
  for (const it of items) {
    const g = groups[groups.length - 1];
    const pos = it.exif.lat != null ? [it.exif.lat, it.exif.lng] : null;
    const near = g && Math.abs(it.ts - g.lastTs) <= 20 * 60000 && (!pos || !g.pos || distM(pos, g.pos) <= 40);
    if (near) { g.items.push(it); g.lastTs = it.ts; if (!g.pos && pos) g.pos = pos; }
    else groups.push({ items: [it], pos, lastTs: it.ts });
  }
  fundQueue = groups.map(g => {
    const withDate = g.items.find(i => i.exif.date);
    return {
      lat: g.pos ? g.pos[0] : null, lng: g.pos ? g.pos[1] : null,
      datum: withDate?.exif.date || null, uhrzeit: withDate?.exif.time || null,
      frisch: !withDate && g.items.every(i => Date.now() - i.mod < 15 * 60000),  // gerade mit der Kamera aufgenommen
      photos: g.items.map(i => ({ blob: i.blob, thumb: i.thumb }))
    };
  });
  queueTotal = fundQueue.length; queueNr = 0;
  if (queueTotal > 1) toast(`${items.length} Fotos → ${queueTotal} Funde erkannt`, 3500);
  nextFromQueue();
}
function nextFromQueue() {
  const p = fundQueue.shift();
  if (!p) { if (queueTotal > 1) toast('Alle Funde aus den Fotos bearbeitet'); queueTotal = 0; return; }
  queueNr++; p.queueInfo = queueTotal > 1 ? `${queueNr} von ${queueTotal}` : '';
  if (p.lat != null) { map.setView([p.lat, p.lng], Math.max(map.getZoom(), 15)); openFundForm(null, [p.lat, p.lng], p); return; }
  if (p.frisch && navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => { p.lat = pos.coords.latitude; p.lng = pos.coords.longitude; p.ortQuelle = 'Standort'; p.datum = today(); p.uhrzeit = nowTime(); openFundForm(null, [p.lat, p.lng], p); },
      () => startFundPlace(p), { enableHighAccuracy: true, timeout: 12000 });
    return;
  }
  startFundPlace(p);
}
function endDraw() {
  if (drawState?.markers) drawState.markers.forEach(m => map.removeLayer(m));
  if (drawState?.line) map.removeLayer(drawState.line);
  drawState = null;
  $('#drawbar').classList.remove('show'); $('#crosshair').classList.remove('show');
  $('#mapFabs').style.display = '';
}

function chipGroup(name, options, selected, multi) {

function renderFormPhotos() {
  const el = $('#fPhotos'); if (!el) return;

$('#fileInput').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  const isNew = !$('#fDel');
  for (const file of files) {
    try {
      const [exif, { blob, thumb }] = await Promise.all([Exif.read(file), processPhoto(file)]);
      formPhotos.push({ id: uid(), blob, thumb, url: URL.createObjectURL(thumb), neu: true });
      // Beim neuen Fund: Ort und Zeit aus dem ersten Foto übernehmen, das welche hat
      if (!isNew) continue;
      const taken = [];
      if (exif.lat != null && formPos.quelle !== 'Foto') { formPos = { lat: exif.lat, lng: exif.lng, quelle: 'Foto' }; taken.push('Ort'); $('#fPos').innerHTML = posText(); }

async function saveFund(id, old) {

    const r = revierAt([f.lat, f.lng]); f.revierId = r ? r.id : null;

  for (const pid of (old.fotos || []).filter(x => !keep.includes(x))) await DB.del('fotos', pid);

function chartSvg(days, ref) {

  const temps = days.map(d => d.tm).filter(x => x != null); const tMin = Math.min(0, ...temps), tMax = Math.max(20, ...temps);
  const x = i => L0 + (i + WETTER_VOR) * bw;

  const yT = t => H - B - ((t - tMin) / (tMax - tMin)) * (H - B - T);

  for (const d of days) {
    const i = diffDays(ref, d.t);
    if (d.p > 0) bars += `<rect x="${x(i) + 1}" y="${yP(d.p)}" width="${bw - 2}" height="${H - B - yP(d.p)}" rx="1.5" fill="var(--rain)" opacity="${d.fc ? 0.4 : 0.85}"/>`;
    if (d.tm != null) line += `${line ? 'L' : 'M'}${x(i) + bw / 2},${yT(d.tm)}`;
  }
  const ticks = [-21, -14, -7, 0, 7].map(i => `<text x="${x(i) + bw / 2}" y="${H - 6}" font-size="9" text-anchor="middle" fill="var(--ink-faint)">${i === 0 ? 'Fund' : (i > 0 ? '+' : '') + i}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Regen und Temperatur rund um den Fund">
    <line x1="${L0}" x2="${W - 4}" y1="${H - B}" y2="${H - B}" stroke="var(--border)"/>
    <rect x="${x(0)}" y="${T}" width="${bw}" height="${H - B - T}" fill="var(--cap-wash)"/>
    ${bars}<path d="${line}" fill="none" stroke="var(--temp)" stroke-width="2" stroke-linejoin="round"/>
    <text x="2" y="${T + 8}" font-size="9" fill="var(--rain)">${Math.round(maxP)} mm</text>
    <text x="2" y="${H - B - 2}" font-size="9" fill="var(--temp)">${Math.round(tMin)}°</text>
    <text x="2" y="${T + 20}" font-size="9" fill="var(--temp)">${Math.round(tMax)}°</text>
    ${ticks}</svg>`;
}

/* ---------- Prognose (Ableitung) ---------- */
/* Faustregel-Modell: Saison × Lebensraum/Bäume × Wetter (Regen 14 Tage, Ø Temperatur 7 Tage, Frost).
   Eigene Funde in einem Revier verschieben die Schwellen Richtung der selbst erlebten Bedingungen. */
function ownStats(artId, revierId) {
  const fs = state.funde.filter(f => f.artId === artId && f.revierId === revierId);
  const ws = fs.filter(f => f.wetter?.sum).map(f => f.wetter.sum);
  return {
    n: fs.length, monate: [...new Set(fs.map(f => +f.datum.slice(5, 7)))],
    rainMin: ws.length ? Math.min(...ws.map(s => s.rain14)) : null, rainAvg: ws.length ? ws.reduce((a, s) => a + s.rain14, 0) / ws.length : null,
    tMin: ws.length ? Math.min(...ws.map(s => s.tmean7 ?? 99)) : null, tMax: ws.length ? Math.max(...ws.map(s => s.tmean7 ?? -99)) : null, nw: ws.length
  };
}
function scoreArt(p, r, ctx) {
  const why = []; const own = ownStats(p.id, r.id);
  const m = ctx.month, prev = m === 1 ? 12 : m - 1, next = m === 12 ? 1 : m + 1;
  let season = p.haupt.includes(m) ? 1 : p.monate.includes(m) ? 0.7 : (p.monate.includes(prev) || p.monate.includes(next)) ? 0.15 : 0;
  if (own.monate.includes(m)) season = Math.max(season, 0.9);
  if (season === 0) return null;
  if (p.haupt.includes(m)) why.push('Hauptsaison'); else if (season < 0.5) why.push('Saisonrand');
  // Lebensraum und Bäume
  const lr = p.lebensraum.includes(r.typ);
  let hab;
  if (own.n) { hab = 1; why.push(`${own.n}× hier gefunden`); }
  else if (r.baeume.length && p.baeume.length) {
    const hit = p.baeume.filter(b => r.baeume.includes(b));
    hab = hit.length ? 1 : (lr ? 0.35 : 0.15); if (hit.length) why.push(hit.join('/'));
  } else hab = lr ? 0.8 : 0.3;
  if (!own.n && r.boden !== 'unbekannt' && p.boden !== 'egal' && p.boden !== r.boden) { hab *= 0.6; why.push(`mag eher ${p.boden === 'kalk' ? 'Kalk' : 'sauren Boden'}`); }
  // Wetter
  let req = p.wetter.regen14, lo = p.wetter.tMin, hi = p.wetter.tMax;
  if (own.nw >= 2) { req = Math.min(req, own.rainMin * 0.9); lo = Math.min(lo, own.tMin - 1); hi = Math.max(hi, own.tMax + 1); }
  let rs = clamp(ctx.rain14 / Math.max(req, 1), 0, 1); if (rs < 0.3) rs = 0.1;
  const t = ctx.tmean7; const dist = t == null ? 0 : t < lo ? lo - t : t > hi ? t - hi : 0;
  const ts = dist === 0 ? 1 : dist <= 3 ? 1 - dist / 4 : 0.1;
  let wx = 0.55 * rs + 0.45 * ts; if (rs < 0.5) wx = Math.min(wx, 0.4);
  if (rs >= 1) why.push('genug Regen'); else if (rs < 0.5) why.push('zu trocken');
  if (dist > 0) why.push(t < lo ? 'zu kalt' : 'zu warm');
  let frost = 1; if (p.wetter.frost) { frost = ctx.frost14 ? 1.1 : 0.85; if (ctx.frost14) why.push('Kältereiz'); }
  let total = clamp(season * hab * wx * frost * (own.n ? 1.15 : 1), 0, 1);
  return { total, why, own };
}

  const key = r.id + today();

  const c = centroid(r.punkte);

  return (progCache[key] = days);
}

    try { await navigator.share({ files: [file], title: 'PilzLog-Sicherung' }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  await DB.put('meta', { key: 'letzteSicherung', wert: today() });
}
$('#importInput').onchange = async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'PilzLog') throw new Error('keine PilzLog-Datei');
    if (!confirm(`Sicherung vom ${new Date(data.erstellt).toLocaleDateString('de-DE')} einspielen?\n${data.reviere.length} Reviere, ${data.funde.length} Funde, ${data.fotos.length} Fotos.\nVorhandene Einträge mit gleicher ID werden ersetzt, alles andere bleibt.`)) return;
    for (const r of data.reviere) await DB.put('reviere', r);
    for (const f of data.funde) await DB.put('funde', f);
    for (const p of data.fotos) await DB.put('fotos', { id: p.id, fundId: p.fundId, blob: await dataUrlToBlob(p.blob), thumb: await dataUrlToBlob(p.thumb) });
    await loadAll(); closeSheet(); toast('Sicherung eingespielt'); fitAll();
  } catch (err) { toast('Datei konnte nicht gelesen werden: ' + err.message, 4000); }
};
async function openMenu() {
  const last = await DB.get('meta', 'letzteSicherung');
  const est = navigator.storage?.estimate ? await navigator.storage.estimate() : null;
  openSheet(`
    <h2>PilzLog</h2><div class="sub">Version 0.2 · ${state.reviere.length} Reviere · ${state.funde.length} Funde${est ? ` · ${r1(est.usage / 1048576)} MB belegt` : ''}</div>
    <div class="sectiontitle">Sicherung</div>
    <p class="muted" style="margin-top:0">Deine Daten liegen nur auf diesem Gerät. Auf dem iPhone kann Safari Daten von Webseiten löschen, die länger nicht benutzt wurden – App zum Home-Bildschirm hinzufügen und regelmäßig sichern.</p>
    <p class="faint">Letzte Sicherung: ${last ? fmtDate(last.wert) : 'noch keine'}</p>
    <div class="actions"><button class="btn primary" id="mExport">Sicherung erstellen</button><button class="btn" id="mImport">Sicherung einspielen</button></div>
    <div class="sectiontitle">Wetter</div>
    <div class="actions" style="margin-top:0"><button class="btn" id="mWx">Fehlendes Wetter jetzt nachladen</button></div>
    <div class="sectiontitle">Datenschutz</div>
    <p class="faint">Nach außen gehen nur: Kartenkacheln (OpenStreetMap, OpenTopoMap) und auf ca. 1 km gerundete Koordinaten an Open-Meteo für das Wetter. Kein Konto, keine Cloud, keine Werbung. Fotos werden ohne GPS-Daten gespeichert.</p>`);
  $('#mExport').onclick = exportBackup;
  $('#mImport').onclick = () => $('#importInput').click();
  $('#mWx').onclick = async () => { toast('Wetter wird nachgeladen …'); let n = 0; for (const f of state.funde) { if (f.wetter?.komplett) continue; try { if (await updateFundWeather(f, true)) n++; } catch {} } await loadAll(); toast(`${n} Fund(e) aktualisiert`); };
}

/* ---------- Navigation ---------- */
function showView(v) {
  state.view = v;
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.id === 'view-' + v));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  if (v === 'karte') setTimeout(() => map.invalidateSize(), 50);
  renderCurrentView();
}
function renderCurrentView() {
  if (state.view === 'karte') renderMap();
  if (state.view === 'funde') renderFunde();
  if (state.view === 'prognose') renderPrognose();
  if (state.view === 'karten') renderKarten();
}
async function loadAll() {
  [state.reviere, state.funde] = await Promise.all([DB.all('reviere'), DB.all('funde')]);
  state.reviere.sort((a, b) => (a.angelegt || '').localeCompare(b.angelegt || ''));
  renderMap(); if (state.view !== 'karte') renderCurrentView();
}

$('#nav').onclick = e => { const b = e.target.closest('button'); if (b) showView(b.dataset.view); };
$('#btnMenu').onclick = openMenu;
$('#btnRevier').onclick = () => startRevierDraw();
$('#btnFund').onclick = () => startFundPlace();
$('#btnFoto').onclick = () => $('#fotoFundInput').click();
$('#fotoFundInput').onchange = e => { const files = [...e.target.files]; e.target.value = ''; startFromPhotos(files); };
$('#btnLocate').onclick = () => locate(ll => L.circleMarker(ll, { radius: 7, color: '#fff', weight: 2, fillColor: '#2F6FA6', fillOpacity: 1 }).addTo(map));
$('#btnLayer').onclick = () => { setBase((baseIdx + 1) % BASES.length); toast('Karte: ' + BASES[baseIdx].name, 1200); };

(async function start() {
  initMap();
  await loadAll();
  fitAll();
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  refreshPendingWeather();
  window.addEventListener('online', refreshPendingWeather);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
